
[platformio]
extra_configs = boards.ini

# Global settings applied to all environments
[env]
lib_extra_dirs = lib              ; Look for local libraries in the 'lib' folder
monitor_filters =
    time                          ; Adds timestamps to each line of output
    esp32_exception_decoder       ; Decodes ESP32 crash dumps to source info


[env:hesperus-gate-s3-zero]
; Waveshare/generic ESP32-S3-Zero. STATUS_LED=21 is its onboard NeoPixel.
extends = base_s3_zero, feature_oled, feature_ws_client, feature_http
lib_deps =
    ${base_s3_zero.lib_deps}
    ${feature_oled.lib_deps}
    ${feature_ws_client.lib_deps}
    ${feature_http.lib_deps}
    jchristensen/JC_Button @ ^2.1.5
    bblanchon/ArduinoJson @ ^7
build_flags =
    ${base_s3_zero.build_flags}
    ${feature_oled.build_flags}
    ${feature_ws_client.build_flags}
    ${feature_http.build_flags}
    -D ARDUINO_TINYUSB=1
    -D CORE_DEBUG_LEVEL=0


[env:hesperus-gate-s3-super-mini]
; ESP32-S3 Super Mini. STATUS_LED=48 is its onboard NeoPixel.
extends = base_s3_super_mini, feature_oled, feature_ws_client, feature_http
lib_deps =
    ${base_s3_super_mini.lib_deps}
    ${feature_oled.lib_deps}
    ${feature_ws_client.lib_deps}
    ${feature_http.lib_deps}
    jchristensen/JC_Button @ ^2.1.5
    bblanchon/ArduinoJson @ ^7
build_flags =
    ${base_s3_super_mini.build_flags}
    ${feature_oled.build_flags}
    ${feature_ws_client.build_flags}
    ${feature_http.build_flags}
    -D ARDUINO_TINYUSB=1
    -D CORE_DEBUG_LEVEL=0
    -D BEAM_SENSOR_STREAM_DEBUG=1
