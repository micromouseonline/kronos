[base_m5_core]
# Combines: Global + Classic ESP32 Hardware + Display Library
# NOTE: uses the official M5Stack-specific board profile, not generic
# esp32dev -- that profile carries the correct flash_mode (qio) for this
# hardware. A prior version of this config manually set flash_mode = dio on
# esp32dev, which mismatches the actual M5Stack Core flash chip and causes a
# boot loop (repeating ROM bootloader banner, resets before any app code
# runs, screen stays dark) -- not a display bug, a boot-time flash config
# mismatch.
extends = env_common, proc_esp32, feature_oled
board = m5stack-core-esp32-16M
board_build.partitions = default_16MB.csv
lib_deps =
    ${env_common.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32.build_flags}
    ${feature_oled.build_flags}
    -D BOARD_M5_CORE
    -D STATUS_LED=-1