
[platformio]
extra_configs = boards.ini
default_envs = hesperus-emitter-s3-zero

# Global settings applied to all environments
[env]
lib_extra_dirs = lib              ; Look for local libraries in the 'lib' folder
monitor_filters =
    esp32_exception_decoder       ; Decodes ESP32 crash dumps to source info


[env:hesperus-emitter-s3-zero]
; Waveshare/generic ESP32-S3-Zero. STATUS_LED=21 is its onboard NeoPixel.
extends = base_s3_zero
lib_deps =
    ${base_s3_zero.lib_deps}
build_flags =
    ${base_s3_zero.build_flags}
    -D ARDUINO_TINYUSB=1
    -D CORE_DEBUG_LEVEL=0


[env:hesperus-emitter-s3-super-mini]
; ESP32-S3 Super Mini. STATUS_LED=48 is its onboard NeoPixel.
extends = base_s3_super_mini
lib_deps =
    ${base_s3_super_mini.lib_deps}
build_flags =
    ${base_s3_super_mini.build_flags}
    -D ARDUINO_TINYUSB=1
    -D CORE_DEBUG_LEVEL=0
