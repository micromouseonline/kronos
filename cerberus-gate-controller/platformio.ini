# ------------------------------------------------------------------------------
# Native host build for running unit tests (`pio test -e native`). Independent
# of boards.ini's espressif32/arduino bases - no board, no display, no wifi.
# ------------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Itest/native_mocks
    -Isrc
