
[platformio]
extra_configs = boards.ini

# Global settings applied to all environments
[env]
upload_flags =
    --before=default_reset
    --after=hard_reset
monitor_rts = 0
monitor_dtr = 0

# ------------------------------------------------------------------------------
# Central Repository Release Metadata (Non-Building Configuration Block)
# ------------------------------------------------------------------------------
[env:version_metadata]
release_version = 0.1.1


[env:cerberus-esp32-s3-cyd-touch-freenove]
extends = base_s3_cyd_touch_freenove, feature_lovyangfx, feature_neokey, feature_lvgl, feature_http
test_ignore = *
lib_deps =
    ${base_s3_cyd_touch_freenove.lib_deps}
    ${feature_lovyangfx.lib_deps}
    ${feature_neokey.lib_deps}
    ${feature_lvgl.lib_deps}
    ${feature_http.lib_deps}
build_flags =
    ${base_s3_cyd_touch_freenove.build_flags}
    ${feature_lovyangfx.build_flags}
    ${feature_neokey.build_flags}
    ${feature_lvgl.build_flags}
    ${feature_http.build_flags}


[env:cerberus-m5-core]
extends = base_m5_core, feature_lovyangfx, feature_neokey, feature_lvgl, feature_http
