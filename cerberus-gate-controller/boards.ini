# ==============================================================================
# BASE_BOARDS.INI - Modular Environment Composition Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Global Baseline
# ------------------------------------------------------------------------------
[env_common]
# Core framework and platform definitions
# NOTE: previously pinned to the pioarduino community fork
# (https://github.com/pioarduino/platform-espressif32) to get ESP32-C6
# support. Dropped: the fork's platform package self-identifies with the
# exact same name ("espressif32") as mainline Espressif's own platform, at
# both the platform and framework-package level. That collides in
# PlatformIO's shared global package cache with any other PlatformIO project
# on the same machine that uses the standard platform -- even just opening
# such a project in the PlatformIO VSCode extension can silently overwrite
# the shared cache slot this repo depended on. It also means an unpinned
# `platform = espressif32` is NOT enough to escape the fork if it's still
# installed locally: PlatformIO resolves unpinned constraints to the highest
# available version, and the fork's version number (51.x) is higher than
# mainline's (7.x) -- hence the explicit version pin below. Not worth the
# cross-machine fragility for a repo shared across multiple users/OSes. If
# ESP32-C6 support is needed again, use the Arduino IDE for that target, or
# reinstate the fork pin here (and isolate its package cache via
# PlatformIO's `core_dir` option).
platform = espressif32 @ 7.0.1
framework = arduino
monitor_speed = 9600

# Automatically run the composition and documentation script on every build
extra_scripts =
    ; pre:../tools/auto_compose.py
    pre:../tools/generate_version_header.py
    post:../tools/generate_merged_bin.py

# Strict dependency resolution to avoid polluting projects that don't need them
# also important for lvgl
; lib_ldf_mode = chain+
# Turn off the dependency finder completely to eliminate the startup lag
; lib_ldf_mode = off
# Caches the dependency verification calculations across minor tool chain executions
; lib_compat_mode = strict
; lib_compat_mode = off

# we should not need any explicit library dependencies here
lib_deps =
    
# ensure we are properly using C++17 and not older standards
build_unflags =
    -std=c++11
    -std=gnu++11
    -std=c++14
    -std=gnu++14

# Global compilation flags required across all projects
build_flags =
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
    -Isrc
    -D ARDUINO_USB_MODE=1
    -Wl,--allow-multiple-definition
    -std=gnu++17


# ------------------------------------------------------------------------------
# 2. Processor & SoC Architecture Blocks
# ------------------------------------------------------------------------------
[proc_esp32s3]
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.usb_mode = usb-device
board_build.usb_cdc = enabled
build_flags = 
    -D ARDUINO_USB_DFU_ON_BOOT=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

[proc_esp32c3]
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1

# ESP32-C6 support disabled -- required the pioarduino fork, dropped for
# cross-machine package-cache reliability (see env_common's platform comment
# above). Use the Arduino IDE for C6 targets, or reinstate the fork pin and
# uncomment this section (plus base_c6_xiao/base_c6_super_mini below, and the
# matching [env:*-c6-*] blocks in each project's platformio.ini) if
# PlatformIO-based C6 support is needed again.
# [proc_esp32c6]
# board_build.mcu = esp32c6
# board_build.f_cpu = 160000000L
# board_build.flash_mode = qio
# build_flags =
#     -D ARDUINO_USB_CDC_ON_BOOT=1

[proc_esp32]
board_build.mcu = esp32
board_build.f_cpu = 240000000L
build_flags = 
    -mfix-esp32-psram-cache-issue


# ------------------------------------------------------------------------------
# Hardware Feature Blocks: PSRAM Options
# ------------------------------------------------------------------------------
[feature_psram_qspi_8mb]
# For boards with 8MB Quad-SPI PSRAM
board_build.arduino.memory_type = qio_qspi
build_flags = 
    -D BOARD_HAS_PSRAM
    -D BOARD_PSRAM_SIZE=8

[feature_psram_opi_8mb]
# For boards with 8MB Octal-SPI PSRAM (common on higher-end S3 modules)
board_build.arduino.memory_type = qio_opi
build_flags = 
    -D BOARD_HAS_PSRAM
    -D BOARD_PSRAM_SIZE=8

[feature_psram_opi_16mb]
# For boards with 16MB Octal-SPI PSRAM
board_build.arduino.memory_type = qio_opi
build_flags = 
    -D BOARD_HAS_PSRAM
    -D BOARD_PSRAM_SIZE=16



# ------------------------------------------------------------------------------
# 3. Hardware Peripheral / Optional Feature Blocks
# ------------------------------------------------------------------------------
[feature_ble]
lib_deps = h2zero/NimBLE-Arduino @ ^2.3.0
build_flags = -D HAS_BLE=1

[feature_oled]
lib_deps = olikraus/U8g2 @ ^2.36.2
build_flags = -D HAS_DISPLAY=1

[feature_neopixel]
lib_deps = adafruit/Adafruit NeoPixel @ ^1.15.5
build_flags = -D HAS_NEOPIXEL=1

[feature_lovyangfx]
lib_deps = lovyan03/LovyanGFX @ ^1.1.16
build_flags = -D HAS_LOVYANGFX=1

[feature_neokey]
# Adafruit NeoKey 1x4 (seesaw, I2C). Adafruit_NeoKey_1x4.h ships inside the
# "Adafruit seesaw Library" package itself -- no separate NeoKey library
# exists on the PlatformIO registry. NeoKey is an optional, runtime-detected
# attachment enabled by default on every board profile (see
# USER-INPUT-SYSTEM.md), so every env extends this via ${feature_neokey.lib_deps}
# the same way other feature_* blocks are composed.
lib_deps =
    adafruit/Adafruit BusIO @ ^1.17.2
    adafruit/Adafruit seesaw Library @ ^1.7.9
build_flags = -D HAS_NEOKEY_LIB=1

[feature_lvgl]
# EEZ Studio-designed UI, rendered through LVGL on top of LovyanGFX (see
# lib/display/lvgl-bridge.h). Touchscreen boards only -- M5 Core has no
# touchscreen and is not wired to this feature.
lib_deps = lvgl/lvgl @ ^8.3.11
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE=1
    # PlatformIO's project include/ dir (lv_conf.h) is only auto-added to
    # src/'s include path, not lib/'s -- LDF gives each lib/ folder its own
    # scoped build environment that doesn't inherit it. Confirmed via a
    # verbose build: lib/ui/screens.c's actual compile line had no -Iinclude
    # at all. Needed explicitly here so LV_CONF_INCLUDE_SIMPLE's
    # #include "lv_conf.h" resolves from every lib/ too, not just src/.
    -Iinclude

[feature_http]
# Async HTTP server + JSON, for POST /api/event and the leaderboard page
# (Stages G/H). esp32async/* is the actively maintained fork, confirmed via
# `pio pkg search`: the original me-no-dev/AsyncTCP + me-no-dev/
# ESPAsyncWebServer (and the mathieucarbou mirror) haven't published since
# Jan 2025, while esp32async continues to ship releases.
lib_deps =
    esp32async/AsyncTCP @ ^3.5.0
    esp32async/ESPAsyncWebServer @ ^3.11.2
    bblanchon/ArduinoJson @ ^7
build_flags = -D HAS_HTTP=1


# ==============================================================================
# 4. Composite Target Variants (Boards)
# ==============================================================================
# Convention: PlatformIO's `extends` does not merge build_flags/lib_deps from
# parent sections once a section redefines that key -- every parent's value
# must be pulled in explicitly via ${parent.key}, or it is silently dropped.
# To keep this tractable:
#   - list extends parents in this fixed order: env_common, proc_*, feature_*
#   - mirror that same order in build_flags/lib_deps:
#       ${env_common.build_flags}
#       ${proc_x.build_flags}
#       ${feature_y.build_flags}  (one per feature used)
#   - after editing this file, run: python3 tools/check_ini_composition.py
#     it flags dropped parent references and ambiguous multi-feature lib_deps

[base_s3_zero]
# Combines: Global + S3 Hardware + Neopixel Driver
extends = env_common, proc_esp32s3, feature_neopixel
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
lib_deps =
    ${env_common.lib_deps}
    ${feature_neopixel.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32s3.build_flags}
    ${feature_neopixel.build_flags}
    -D BOARD_HAS_PSRAM
    -D BOARD_S3_ZERO
    -D STATUS_LED=21
    -D NEOPIXEL_COLOR_ORDER=NEO_RGB

[base_s3_super_mini]
# Combines: Global + S3 Hardware + Neopixel Driver
extends = env_common, proc_esp32s3, feature_neopixel
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
lib_deps =
    ${env_common.lib_deps}
    ${feature_neopixel.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32s3.build_flags}
    ${feature_neopixel.build_flags}
    -D BOARD_HAS_PSRAM
    -D BOARD_S3_SUPER_MINI
    -D STATUS_LED=48
    -D NEOPIXEL_COLOR_ORDER=NEO_GRB

[base_s3_cyd_touch_freenove]
# Combines: Global + S3 Hardware + Neopixel Driver + Display Library
extends = env_common, proc_esp32s3, feature_neopixel, feature_oled
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
lib_deps =
    ${env_common.lib_deps}
    ${feature_neopixel.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32s3.build_flags}
    ${feature_neopixel.build_flags}
    ${feature_oled.build_flags}
    -D BOARD_HAS_PSRAM
    -D BOARD_S3_CYD_TOUCH_FREENOVE
    -D STATUS_LED=42

[base_cyd2usb_diymalls_ili9341]
# Combines: Global + Classic ESP32 Hardware + Display Library
# Sunton "CYD2USB", DIYMALLS variant with an ILI9341 panel driver --
# ESP32-2432S028R-family board with both micro-USB and USB-C ports, ILI9341
# 240x320 panel, resistive XPT2046 touch on its own dedicated SPI pins (not
# shared with the panel's bus). Chip family, flash size and STATUS_LED here
# are the commonly-documented values for this board family.
# VERIFIED for the board purchased from https://www.amazon.co.uk/dp/B0CG2WQGP9
extends = env_common, proc_esp32, feature_oled
board = esp32dev
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = dio
# no_ota.csv: one 2MB app partition + 1.875MB SPIFFS, instead of default.csv's
# dual-OTA-slot scheme (two 1.25MB app partitions + 1.375MB SPIFFS). This
# project has no OTA update code anywhere (grepped, confirmed) and was
# pinned at ~89% of the 1.25MB app slot before Stage G/H's HTTP server code
# even exists -- no_ota.csv doubles usable app space while keeping most of
# the SPIFFS partition intact, for a planned SD-card/SPIFFS logging feature.
board_build.partitions = no_ota.csv
lib_deps =
    ${env_common.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32.build_flags}
    ${feature_oled.build_flags}
    -D BOARD_CYD2USB_DIYMALLS_ILI9341
    -D STATUS_LED=-1

[base_cyd2usb_diymalls_st7789]
# Combines: Global + Classic ESP32 Hardware + Display Library
# Sunton "CYD2USB", DIYMALLS variant with an ST7789 panel driver --
# ESP32-2432S028R-family board with both micro-USB and USB-C ports, ST7789
# 240x320 panel (NOT ILI9341 -- differs from the ILI9341 variant despite
# visually-identical boards), resistive XPT2046 touch on its own dedicated
# SPI pins (not shared with the panel's bus). VERIFIED for the board
# purchased from https://www.amazon.co.uk/dp/B0CQX9Q68P
extends = env_common, proc_esp32, feature_oled
board = esp32dev
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = dio
# no_ota.csv: see base_cyd2usb_diymalls_ili9341's comment above -- same
# rationale applies to this board (same flash size, same tight headroom).
board_build.partitions = no_ota.csv
lib_deps =
    ${env_common.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32.build_flags}
    ${feature_oled.build_flags}
    -D BOARD_CYD2USB_DIYMALLS_ST7789
    -D STATUS_LED=-1

[base_jc2432w328c]
# Combines: Global + Classic ESP32 Hardware + Display Library
# Guition/JC "JC2432W328C" -- a fourth, distinct CYD-family board. Copied
# from base_cyd2usb_diymalls_st7789 as a starting point -- UNVERIFIED for
# this board (chip family, flash size, panel driver, pins, STATUS_LED all
# just guessed from the DIYMALLS boards). Adjust once confirmed on real
# hardware.
extends = env_common, proc_esp32, feature_oled
board = esp32dev
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = dio
# no_ota.csv: see base_cyd2usb_diymalls_ili9341's comment above -- same
# rationale applies to this board (same flash size, same tight headroom).
board_build.partitions = no_ota.csv
lib_deps =
    ${env_common.lib_deps}
    ${feature_oled.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32.build_flags}
    ${feature_oled.build_flags}
    -D BOARD_JC2432W328C
    -D STATUS_LED=16
    -D LED_ACTIVE_LOW=1

[base_c3_super_mini]
# Combines: Global + C3 Hardware
extends = env_common, proc_esp32c3
board = esp32-c3-devkitm-1
lib_deps =
    ${env_common.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32c3.build_flags}
    -D BOARD_C3_SUPER_MINI
    -D HAS_LED
    -D STATUS_LED=8
    -D LED_ACTIVE_LOW=1

[base_c3_xiao]
# Combines: Global + C3 Hardware
extends = env_common, proc_esp32c3
board = seeed_xiao_esp32c3
lib_deps =
    ${env_common.lib_deps}
build_flags =
    ${env_common.build_flags}
    ${proc_esp32c3.build_flags}
    -D BOARD_C3_XIAO
    -D HAS_LED
    -D STATUS_LED=10

# ESP32-C6 support disabled -- see the note above [proc_esp32c6] near the top
