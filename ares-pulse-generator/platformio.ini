
[platformio]
extra_configs = boards.ini

# Global settings applied to all environments
[env]
lib_extra_dirs = lib              ; Look for local libraries in the 'lib' folder
monitor_filters =
    time                          ; Adds timestamps to each line of output
    esp32_exception_decoder       ; Decodes ESP32 crash dumps to source info


[env:ares-pulser-s3-zero]
; Waveshare/generic ESP32-S3-Zero. STATUS_LED=21 is its onboard NeoPixel.
extends = base_s3_zero, feature_oled
lib_deps =
    ${base_s3_zero.lib_deps}
    ${feature_oled.lib_deps}
    jchristensen/JC_Button @ ^2.1.5
build_flags =
    ${base_s3_zero.build_flags}
    ${feature_oled.build_flags}
    -D ARDUINO_TINYUSB=1
    -D CORE_DEBUG_LEVEL=0


[env:ares-pulser-s3-super-mini]
; ESP32-S3 Super Mini. STATUS_LED=48 is its onboard NeoPixel.
extends = base_s3_super_mini, feature_oled
lib_deps =
    ${base_s3_super_mini.lib_deps}
    ${feature_oled.lib_deps}
    jchristensen/JC_Button @ ^2.1.5
build_flags =
    ${base_s3_super_mini.build_flags}
    ${feature_oled.build_flags}
    -D ARDUINO_TINYUSB=1
    -D CORE_DEBUG_LEVEL=0


[env:ares-pulser-c3-super-mini]
; ESP32-C3 Super Mini. base_c3_super_mini has no onboard NeoPixel driver by
; default (cerberus only wires it up as a plain LED there) -- add
; feature_neopixel explicitly so the gate's Adafruit_NeoPixel status LED
; still links on this board.
extends = base_c3_super_mini, feature_neopixel, feature_oled
lib_deps =
    ${base_c3_super_mini.lib_deps}
    ${feature_neopixel.lib_deps}
    ${feature_oled.lib_deps}
    jchristensen/JC_Button @ ^2.1.5
build_flags =
    ${base_c3_super_mini.build_flags}
    ${feature_neopixel.build_flags}
    ${feature_oled.build_flags}
    ; Unverified: WS2812-style default, not confirmed against real hardware.
    -D NEOPIXEL_COLOR_ORDER=NEO_GRB
    -D CORE_DEBUG_LEVEL=0


[env:ares-pulser-c3-xiao]
; Seeed XIAO ESP32-C3. Same feature_neopixel note as ares-pulser-c3-super-mini.
extends = base_c3_xiao, feature_neopixel, feature_oled
lib_deps =
    ${base_c3_xiao.lib_deps}
    ${feature_neopixel.lib_deps}
    ${feature_oled.lib_deps}
    jchristensen/JC_Button @ ^2.1.5
build_flags =
    ${base_c3_xiao.build_flags}
    ${feature_neopixel.build_flags}
    ${feature_oled.build_flags}
    ; Unverified: WS2812-style default, not confirmed against real hardware.
    -D NEOPIXEL_COLOR_ORDER=NEO_GRB
    -D CORE_DEBUG_LEVEL=0
